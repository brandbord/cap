<title>Cap — ma vie, en clair</title>
<script>/* thème appliqué avant l'affichage : évite le flash clair */
(function () { var p = 'auto'; try { p = localStorage.getItem('cap.theme') || 'auto'; } catch (e) {}
  var dark = p === 'dark' || (p === 'auto' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.dataset.theme = dark ? 'dark' : 'light'; })();</script>
